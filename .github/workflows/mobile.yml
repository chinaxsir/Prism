name: Mobile Build

# 推送 main 或手动触发：产出 Android APK 与 TrollStore（巨魔）未签名 IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      # init / build 两个步骤都要通过 NDK_HOME 找到 NDK；
      # 路径为 GitHub Ubuntu runner 标准 SDK 位置（不用 env 上下文：
      # 它不包含系统级环境变量）
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已从仓库移除的遗留 "tools" 包会直接失败，必须显式指定
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      # 开启详细日志，以便定位移动端编译具体报错
      - name: Build APK
        run: npx tauri android build --apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init

      # 官方未签名路径（CLI 2.12+）：--no-sign 先构建未签名 archive，
      # 再直接从 archive 内的 .app 产出未签名 IPA；
      # 不经过 exportArchive，因此无需任何证书/描述文件
      - name: Build unsigned IPA
        run: npx tauri ios build --no-sign --verbose

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -1)
          test -n "$IPA"
          echo "path=$IPA"
          cp "$IPA" "Prism-0.1.0-TrollStore.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-TrollStore-ipa
          path: Prism-0.1.0-TrollStore.ipa
          if-no-files-found: error
