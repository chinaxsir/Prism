name: Mobile Build

# 推送 main / tag v* / 手动触发：产出 Android APK 与 TrollStore（巨魔）未签名 IPA
# tag 触发时额外把 APK/IPA 作为 Release asset 上传，与桌面端（build.yml）共用同一 Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      # init / build 两个步骤都要通过 NDK_HOME 找到 NDK；
      # 路径为 GitHub Ubuntu runner 标准 SDK 位置（不用 env 上下文：
      # 它不包含系统级环境变量）
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已从仓库移除的遗留 "tools" 包会直接失败，必须显式指定
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: src-tauri/ios-kernel/go.sum

      # Pre-build 步骤里 export 的 CC_* 只在该步骤的 shell 内有效（GitHub Actions
      # 步骤间不保留 shell 环境变量），而 Build APK 时是 Gradle 在全新进程里调
      # cargo：ring 等带 C 源码的 crate 会重新执行 build script，cc-rs 探测
      # 不到 NDK r23+ 已移除的无 API 级别后缀 aarch64-linux-android-clang
      # （ring 的 rerun-if-env 指纹从“已设置”变“未设置”也会触发重编译）。
      # 写入 CARGO_HOME/config.toml 后对任意 cwd 的 cargo 调用都生效。
      - name: Configure cargo NDK toolchain globally
        shell: bash
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CFG="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$CFG")"
          if grep -q "prism-android-ndk" "$CFG" 2>/dev/null; then
            echo "NDK toolchain already configured"
            exit 0
          fi
          cat >> "$CFG" <<EOF

          # prism-android-ndk
          [target.aarch64-linux-android]
          linker = "$BIN/aarch64-linux-android24-clang"
          [target.armv7-linux-androideabi]
          linker = "$BIN/armv7a-linux-androideabi24-clang"
          [target.i686-linux-android]
          linker = "$BIN/i686-linux-android24-clang"
          [target.x86_64-linux-android]
          linker = "$BIN/x86_64-linux-android24-clang"

          [env]
          CC_aarch64_linux_android = "$BIN/aarch64-linux-android24-clang"
          CXX_aarch64_linux_android = "$BIN/aarch64-linux-android24-clang++"
          AR_aarch64_linux_android = "$BIN/llvm-ar"
          CC_armv7_linux_androideabi = "$BIN/armv7a-linux-androideabi24-clang"
          CXX_armv7_linux_androideabi = "$BIN/armv7a-linux-androideabi24-clang++"
          AR_armv7_linux_androideabi = "$BIN/llvm-ar"
          CC_i686_linux_android = "$BIN/i686-linux-android24-clang"
          CXX_i686_linux_android = "$BIN/i686-linux-android24-clang++"
          AR_i686_linux_android = "$BIN/llvm-ar"
          CC_x86_64_linux_android = "$BIN/x86_64-linux-android24-clang"
          CXX_x86_64_linux_android = "$BIN/x86_64-linux-android24-clang++"
          AR_x86_64_linux_android = "$BIN/llvm-ar"
          EOF
          cat "$CFG"

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      # 注入系统 VPN 原生组件：PrismVpnBridge / PrismVpnService（Kotlin）、
      # MainActivity 桥接与 AndroidManifest 权限/Service 声明（幂等）
      - name: Inject Android VPN components
        run: node scripts/inject-android-vpn.cjs

      # tauri android init 只放置模板自带图标，不会把 src-tauri/icons/android
      # 同步进 gen 工程；这里用定制的满幅海军蓝图标覆盖 mipmap/values/anydpi
      - name: Sync Android launcher icons
        run: |
          set -e
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$RES"
          cp -rfv src-tauri/icons/android/. "$RES"/ | tail -20
          echo "--- ic_launcher_background ---"
          cat "$RES/values/ic_launcher_background.xml"

      # Pre-build 直接跑 cargo，tauri::generate_context! 需要 frontendDist(../dist)
      # 已存在；先执行与 tauri build 相同的 beforeBuildCommand
      - name: Build frontend
        run: npm run build

      # geoip/geosite 数据库在 Android 上于编译期 include_bytes! 内嵌
      # （kernel.rs），cargo 构建前必须就位；终端用户无需联网下载
      - name: Fetch geo databases
        run: node scripts/fetch-kernel.cjs --geo-only

      # Android 内核与 iOS 同为进程内承载，但 Go 在 android 上不支持 c-archive，
      # 改用 c-shared 产出 .so，build.rs 以 dylib 方式链接；.so 还需拷入
      # gen/android/.../jniLibs/<abi>/ 才能被 APK 打包并在运行时加载。
      # 不再有 sidecar，也不存在任何运行时内核下载
      - name: Build embedded Android kernels
        working-directory: src-tauri/ios-kernel
        shell: bash
        run: |
          set -e
          go mod tidy
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build() {
            arch="$1"; goarch="$2"; cc="$3"; target="$4"
            CGO_ENABLED=1 GOOS=android GOARCH="$goarch" \
              CC="$BIN/$cc" \
              CGO_CFLAGS="--target=$target" \
              CGO_LDFLAGS="--target=$target" \
              go build -buildmode=c-shared \
                -tags "with_gvisor,with_quic,with_grpc,with_wireguard,with_ech,with_utls,with_clash_api" \
                -trimpath -ldflags="-s -w" \
                -o "libprismkernel-$arch.so" .
          }
          build arm64  arm64 aarch64-linux-android24-clang       aarch64-linux-android24
          build arm    arm   armv7a-linux-androideabi24-clang   armv7a-linux-androideabi24
          build 386    386   i686-linux-android24-clang          i686-linux-android24
          build amd64  amd64 x86_64-linux-android24-clang        x86_64-linux-android24
          ls -lh libprismkernel-*.so

      # 将四个架构的 .so 拷入 Tauri Android 工程的 jniLibs，确保被打包进 APK
      - name: Stage Android kernel .so into jniLibs
        shell: bash
        run: |
          set -e
          JNI="src-tauri/gen/android/app/src/main/jniLibs"
          mkdir -p "$JNI/arm64-v8a" "$JNI/armeabi-v7a" "$JNI/x86" "$JNI/x86_64"
          cp src-tauri/ios-kernel/libprismkernel-arm64.so "$JNI/arm64-v8a/"
          cp src-tauri/ios-kernel/libprismkernel-arm.so   "$JNI/armeabi-v7a/"
          cp src-tauri/ios-kernel/libprismkernel-386.so   "$JNI/x86/"
          cp src-tauri/ios-kernel/libprismkernel-amd64.so "$JNI/x86_64/"
          ls -lhR "$JNI"

      # Gradle rust 插件会把 cargo 详细输出重定向到文件，失败时控制台只见
      # "Process 'command 'npm'' finished with non-zero exit value 1"。
      # 先用 cargo 直接构建全部目标（与 Tauri 调用等价：--lib --release）：
      # - 错误行转成 workflow error annotation（check-runs API 可读）
      # - 完整日志在失败时作为 artifact 上传
      # 同时预热 cargo 缓存。
      - name: Pre-build Rust for all Android targets
        id: prebuild
        shell: bash
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          failed=0

          build() {
            triple="$1"
            cc_name="$2"
            upper="$(echo "$triple" | tr 'a-z-' 'A-Z_')"
            export "CC_${upper}"="$BIN/$cc_name"
            export "CXX_${upper}"="$BIN/$cc_name"
            export "AR_${upper}"="$BIN/llvm-ar"
            export "CARGO_TARGET_${upper}_LINKER"="$BIN/$cc_name"

            logf="src-tauri/cargo-${triple}.log"
            echo "::group::cargo build $triple"
            set +e
            cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target "$triple" 2>&1 | tee "$logf"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              failed=1
              # 提取关键错误行为注解（每行一个，限制 40 行）
              grep -E 'error(\[E[0-9]+\])?[: ]|undefined (symbol|reference)|ld(\.lld)?: error|cannot find -l|note: .*' "$logf" \
                | head -40 | while IFS= read -r line; do
                  safe="$(printf '%s' "$line" | tr -d '\r' | sed 's/::/: :/g' | cut -c1-500)"
                  echo "::error file=src-tauri,title=cargo ${triple}::${safe}"
                done
              true
            fi
          }

          set +e
          build aarch64-linux-android    aarch64-linux-android24-clang
          build armv7-linux-androideabi  armv7a-linux-androideabi24-clang
          build i686-linux-android       i686-linux-android24-clang
          build x86_64-linux-android     x86_64-linux-android24-clang

          if [ "$failed" -ne 0 ]; then
            echo "prebuild-failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload pre-build logs
        if: steps.prebuild.outputs.prebuild-failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuild-logs
          path: src-tauri/cargo-*.log
          if-no-files-found: warn

      - name: Assert pre-build result
        if: steps.prebuild.outputs.prebuild-failed == 'true'
        run: echo "Android cargo pre-build failed; see annotations / log artifact" && exit 1

      # 开启详细日志，以便定位移动端编译具体报错
      - name: Build APK
        run: npx tauri android build --apk --verbose

      # release 未配置 signingConfig，Gradle 产出 *-unsigned.apk，无法安装。
      # CI 内生成一把自签证书（仅用于内测分发，不可上架），zipalign 后
      # 用 apksigner 签名；覆盖删除 unsigned 产物，artifact 只留可安装的 APK
      - name: Sign APK
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          test -x "$BT/apksigner"

          KS="$HOME/.android/prism-ci.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
            -alias prism -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Prism, OU=Mobile, O=Prism, L=NA, ST=NA, C=CN"

          find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" -type f \
            | while IFS= read -r apk; do
              ALIGNED="${apk%-unsigned.apk}-aligned.apk"
              SIGNED="${apk%-unsigned.apk}.apk"
              "$BT/zipalign" -p -f 4 "$apk" "$ALIGNED"
              "$BT/apksigner" sign --ks "$KS" \
                --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias prism --out "$SIGNED" "$ALIGNED"
              rm -f "$apk" "$ALIGNED"
              "$BT/apksigner" verify --print-certs "$SIGNED" | head -3
              echo "signed: $SIGNED"
            done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # tag 构建时把 APK 作为 Release asset 上传（与桌面端 build.yml 共用同一 Release）
      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # iOS 无 sidecar：geoip/geosite 数据库作为 bundle resources 随包分发
      # （tauri.ios.conf.json resources；内核启动时从 resource_dir 拷贝到工作目录）
      - name: Fetch geo databases
        run: node scripts/fetch-kernel.cjs --geo-only

      # iOS 内核内嵌：sing-box 编译为 c-archive 静态库，
      # src-tauri/build.rs 在 iOS target 下链接 libprismkernel.a，
      # Rust 侧经 FFI 调用（src-tauri/src/core/kernel.rs mobile_ffi）
      - name: Build embedded iOS kernel
        working-directory: src-tauri/ios-kernel
        shell: bash
        run: |
          set -e
          go mod tidy
          # FFI 导出依赖 import "C"，cgo 必须开启；netgo 强制纯 Go DNS 解析器，
          # 去除 go.o 对 libresolv（res_9_*）的引用——否则 xcodebuild 归档
          # 链接 libapp.a 时报 Undefined symbols（build.rs 的 -lresolv 管不到
          # Xcode 工程链接参数）
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CC="$(xcrun -sdk iphoneos --find clang)" \
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
          CGO_LDFLAGS="-isysroot $SDK -arch arm64" \
          go build -buildmode=c-archive \
            -tags "netgo,with_gvisor,with_quic,with_grpc,with_wireguard,with_ech,with_utls,with_clash_api" \
            -trimpath -ldflags="-s -w" \
            -o libprismkernel.a .
          ls -lh libprismkernel.a libprismkernel.h

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init

      # tauri ios init 只放置模板自带 Tauri 图标，不会把 src-tauri/icons/ios
      # 同步进 gen 工程；init 完成后把暂存区图标覆盖进 AppIcon.appiconset
      # （文件名与模板 Contents.json 一一对应）
      - name: Sync iOS app icons
        shell: bash
        run: |
          set -e
          ICONSET=$(find src-tauri/gen/apple -type d -name AppIcon.appiconset | head -1)
          test -n "$ICONSET"
          echo "appiconset: $ICONSET"
          cp -fv src-tauri/icons/ios/*.png "$ICONSET"/
          echo "icons synced: $(ls "$ICONSET"/*.png | wc -l | tr -d ' ')"

      # 注入系统 VPN 网络扩展（PacketTunnelProvider target + 主 App 隧道控制器）
      - name: Inject iOS VPN extension
        run: |
          gem list xcodeproj -i >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby scripts/inject-ios-vpn.rb

      # 官方未签名路径（CLI 2.12+）：--no-sign 先构建未签名 archive，
      # 再直接从 archive 内的 .app 产出未签名 IPA；
      # 不经过 exportArchive，因此无需任何证书/描述文件
      - name: Build unsigned IPA
        run: npx tauri ios build --no-sign --verbose

      - name: Prepare TrollStore IPA
        id: ipa
        run: |
          set -e
          IPA=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -1)
          test -n "$IPA"
          echo "built ipa: $IPA"

          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "app: $APP  exec: $EXEC"

          echo "--- Frameworks as shipped by tauri --no-sign ---"
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(empty)"

          # geoip/geosite 不进 bundle resources（实测 Tauri iOS 不会把
          # resources 打进 .app，数组/映射写法均无效），而是编译期
          # include_bytes! 内嵌进主二进制——上一步 Rust 构建成功即代表
          # src-tauri/binaries/*.db 已就位并被内嵌。此处只校验源文件存在，
          # 防止 CI 缓存/清理导致 fetch 步骤被跳过
          for f in geoip.db geosite.db; do
            if [ ! -f "src-tauri/binaries/$f" ]; then
              echo "::error::$f missing from src-tauri/binaries (compile-time embedding source)"
              exit 1
            fi
            echo "embedded source: $f ($(du -h "src-tauri/binaries/$f" | cut -f1))"
          done

          # Swift 运行时解析（修复两轮闪退的最终方案，均由真机 .ips +
          # 工具链实证确认）：
          #
          # 主二进制（Swift 静态库经 rustc/cc 链接）对 15 个 Swift 库的
          # 引用是绝对路径 /usr/lib/swift/...（系统 dyld shared cache
          # 直接提供，iOS 12.2 起 ABI 稳定），唯独 libswift_Concurrency
          # 是 @rpath 引用——它只在 iOS 15+ 进入系统，Xcode 链接器已正确
          # 把 back-deploy 副本放进 Frameworks（供 iOS 13/14 使用）。
          #
          # 真正缺失的是 swift 驱动默认注入、rustc 没带的 LC_RPATH
          # /usr/lib/swift，且它必须排在 @executable_path/Frameworks
          # 【之前】：新系统上 dyld 先命中系统库（back-deploy 版 Core 的
          # checkVersion() 内置
          # "This copy of libswiftCore.dylib requires an OS version prior
          # to X.Y"，在 iOS 16.5 命中嵌入副本会立即 abort——这正是第三轮
          # .ips 的 EXC_CRASH checkVersion）；老系统（<15）系统目录查无
          # _Concurrency，再回退 Frameworks 嵌入副本，其 @rpath 依赖的
          # Core 在 /usr/lib/swift 又能找到（12.2+ 系统自带）。
          #
          # 因此【不得】再额外嵌入 Core 等库：archive 自带的
          # _Concurrency 是唯一需要保留的嵌入 Swift 库。
          find "$APP" -name "*.dylib.original" -delete -print
          find "$APP/Frameworks" -maxdepth 1 -type f -name "libswift*.dylib" \
            ! -name "libswift_Concurrency.dylib" -delete -print
          if [ ! -f "$APP/Frameworks/libswift_Concurrency.dylib" ]; then
            echo "::error::archive did not contain back-deploy libswift_Concurrency.dylib"
            exit 1
          fi
          echo "--- Frameworks swift libs (expect only _Concurrency) ---"
          ls -1 "$APP/Frameworks"/libswift*.dylib

          # 重排 LC_RPATH：全部删除后按 /usr/lib/swift 优先重建，
          # 必须在重签之前修改（install_name_tool 会使旧签名失效）。
          RPATHS_RAW=$(mktemp)
          otool -l "$APP/$EXEC" | awk '
            /cmd LC_RPATH/ { want=1; next }
            want && /path / { sub(/^ *path /,""); sub(/ \(offset [0-9]+\).*/,""); print; want=0 }
          ' > "$RPATHS_RAW"
          echo "--- rpaths before rewrite ---"; cat "$RPATHS_RAW"
          while IFS= read -r rp; do
            install_name_tool -delete_rpath "$rp" "$APP/$EXEC"
          done < "$RPATHS_RAW"
          install_name_tool -add_rpath /usr/lib/swift "$APP/$EXEC"
          while IFS= read -r rp; do
            [ "$rp" = "/usr/lib/swift" ] && continue
            install_name_tool -add_rpath "$rp" "$APP/$EXEC"
          done < "$RPATHS_RAW"
          echo "--- rpaths after rewrite ---"
          otool -l "$APP/$EXEC" | grep -A2 LC_RPATH | grep path

          # 收集 .app 内全部 Mach-O（主二进制 / Frameworks / 插件）
          # 用临时文件列表而非 mapfile：macOS 自带 bash 3.2 没有 mapfile
          LIST=$(mktemp)
          find "$APP" -type f | while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then echo "$f"; fi
          done > "$LIST"
          echo "mach-o count: $(wc -l < "$LIST" | tr -d ' ')"

          # --no-sign 的主二进制不带任何 entitlements；TrollStore 安装时会注入
          # 含 get-task-allow 的 fallback entitlements（模拟 Xcode 签名），
          # iOS 16+ 因此要求开启“开发者模式”，未开启时 amfid 拒绝执行。
          # 主二进制预签一份不含任何受限 entitlement 的 ad-hoc 签名；
          # 其余 Mach-O（含刚补入的 Swift dylib）一律无 entitlements ad-hoc 重签。
          # TrollStore 安装时仍会用 CoreTrust 漏洞重签整个 app，但不再要求
          # 开发者模式，装完即开。
          while IFS= read -r bin; do
            if [ "$bin" = "$APP/$EXEC" ]; then
              codesign --force --sign - \
                --entitlements "$PWD/src-tauri/TrollStore.entitlements.plist" \
                "$bin"
            else
              codesign --force --sign - "$bin"
            fi
          done < "$LIST"

          echo "--- main executable entitlements ---"
          codesign -d --entitlements - "$APP/$EXEC" 2>&1 | head -40 || true

          # 硬校验：任一 Mach-O 仍带受限 entitlement 就让构建失败，
          # 避免下次 Xcode/Tauri 升级悄悄带回 get-task-allow
          bad=0
          while IFS= read -r bin; do
            ents=$(codesign -d --entitlements - "$bin" 2>/dev/null || true)
            if echo "$ents" | grep -qE 'get-task-allow|task_for_pid-allow|com\.apple\.private\.cs\.debugger|com\.apple\.system-task-ports'; then
              echo "::error file=${bin#$PWD/}::restricted developer-mode entitlement present"
              bad=1
            fi
          done < "$LIST"
          if [ "$bad" -ne 0 ]; then
            echo "TrollStore IPA would require Developer Mode; aborting"
            exit 1
          fi
          echo "no restricted entitlements; Developer Mode not required"

          # 硬校验 1：/usr/lib/swift 必须是【第一条】LC_RPATH，
          # 否则 iOS 16.5 会先加载 back-deploy 嵌入副本触发 checkVersion abort
          FIRST_RPATH=$(otool -l "$APP/$EXEC" | awk '
            /cmd LC_RPATH/ { want=1; next }
            want && /path / { sub(/^ *path /,""); sub(/ \(offset [0-9]+\).*/,""); print; exit }
          ')
          echo "first LC_RPATH: $FIRST_RPATH"
          if [ "$FIRST_RPATH" != "/usr/lib/swift" ]; then
            echo "::error::first LC_RPATH must be /usr/lib/swift (got '$FIRST_RPATH')"
            exit 1
          fi

          # 硬校验 2：每个 @rpath/libswift* 引用必须三选一——
          #  a) 命中嵌入（仅允许 Xcode archive 自带的 _Concurrency，iOS<15 兜底）；
          #  b) 命中 SDK stub（iPhoneOS.sdk/usr/lib/swift 下 .tbd/.dylib）；
          #  c) dyld shared cache 常驻库：iOS 12.2 起内置于系统 /usr/lib/swift，
          #     Xcode 16.x SDK 目录里连 .tbd 都没有（已在 CI 全 Xcode find 验证），
          #     第一条 rpath=/usr/lib/swift 保证运行时命中系统新副本。
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SYS_SWIFT="$SDK_PATH/usr/lib/swift"
          echo "sdk swift stub dir: $SYS_SWIFT ($(ls -1 "$SYS_SWIFT" 2>/dev/null | wc -l | tr -d ' ') entries)"
          unresolved=0
          while IFS= read -r bin; do
            otool -L "$bin" 2>/dev/null \
              | grep -oE '@rpath/libswift[A-Za-z0-9_.]*\.dylib' | sort -u \
              | while IFS= read -r ref; do
                  lib="${ref#@rpath/}"
                  if [ -f "$APP/Frameworks/$lib" ]; then
                    echo "embedded (old-OS fallback): $lib"
                    continue
                  fi
                  if ls "$SYS_SWIFT/${lib%.dylib}.tbd" "$SYS_SWIFT/$lib" \
                       >/dev/null 2>&1; then
                    echo "system-provided swift lib: $lib"
                    continue
                  fi
                  case "$lib" in
                    libswiftCore.dylib|\
                    libswiftDataDetection.dylib|\
                    libswiftOSLog.dylib|\
                    libswiftUniformTypeIdentifiers.dylib|\
                    libswiftXPC.dylib)
                      echo "dyld-shared-cache resident (no SDK stub): $lib"
                      ;;
                    *)
                      echo "::error file=${bin#$PWD/}::$lib neither embedded, SDK stub, nor known OS-resident swift lib"
                      exit 1
                      ;;
                  esac
                done || unresolved=1
          done < "$LIST"
          if [ "$unresolved" -ne 0 ]; then
            echo "Swift runtime resolution unverified; aborting"
            exit 1
          fi
          echo "all referenced Swift runtime libraries resolve (system-first rpath)"

          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="$PWD/Prism-$APP_VERSION-TrollStore.ipa"
          rm -f "$OUT"
          (cd "$WORK" && zip -qry "$OUT" Payload)
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-TrollStore-ipa
          path: Prism-*-TrollStore.ipa
          if-no-files-found: error

      # tag 构建时把 IPA 作为 Release asset 上传（与桌面端共用同一 Release）
      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Prism-*-TrollStore.ipa
