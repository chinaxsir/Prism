name: Mobile Build

# 推送 main 或手动触发：产出 Android APK 与 TrollStore（巨魔）未签名 IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      # init / build 两个步骤都要通过 NDK_HOME 找到 NDK；
      # 路径为 GitHub Ubuntu runner 标准 SDK 位置（不用 env 上下文：
      # 它不包含系统级环境变量）
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认安装已从仓库移除的遗留 "tools" 包会直接失败，必须显式指定
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Build APK
        run: npx tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init

      - name: Build unsigned .app
        run: |
          APPLE_DIR=src-tauri/gen/apple
          WORKSPACE=$(find "$APPLE_DIR" -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find "$APPLE_DIR" -maxdepth 1 -name "*.xcodeproj" | head -1)
          # Tauri 插件经 CocoaPods 集成：存在 workspace 时必须构建 workspace，
          # 否则 Pod 不参与构建 → 链接失败
          if [ -n "$WORKSPACE" ]; then
            TARGET_FLAG=(-workspace "$WORKSPACE")
            LIST_KEY=workspace
          else
            TARGET_FLAG=(-project "$PROJECT")
            LIST_KEY=project
          fi
          # scheme 名与产品名一致（Prism），不能用工程名（prism-proxy）；
          # 动态列出并排除 Pods/扩展/Widget 等附属 scheme，兜底取第一个
          SCHEME=$(xcodebuild -list "${TARGET_FLAG[@]}" -json \
            | jq -r ".[\"$LIST_KEY\"].schemes[]" \
            | grep -viE 'extension|widget|^pods$' \
            | head -1)
          echo "target=${TARGET_FLAG[*]} scheme=$SCHEME"
          xcodebuild \
            "${TARGET_FLAG[@]}" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TrollStore IPA
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -qr "Prism-0.1.0-TrollStore.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-TrollStore-ipa
          path: Prism-0.1.0-TrollStore.ipa
          if-no-files-found: error
