name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      # sing-box 内核以 sidecar 随包分发（bundle.externalBin），
      # 构建前必须按目标平台抓取，否则 tauri build 会因缺少 externalBin 失败
      - name: Fetch sing-box sidecar
        run: node scripts/fetch-kernel.cjs --triplet ${{ matrix.target }}

      # 硬校验：内核 sidecar 与 geo 数据库必须随包分发——
      # 终端用户网络可能完全不支持外网，应用任何时候都不联网下载必需文件
      - name: Verify bundled kernel & geo databases
        shell: bash
        run: |
          set -e
          ls -1 src-tauri/binaries/
          SIDECAR="src-tauri/binaries/sing-box-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then SIDECAR="$SIDECAR.exe"; fi
          test -f "$SIDECAR"
          test -f src-tauri/binaries/geoip.db
          test -f src-tauri/binaries/geosite.db
          echo "all required files present (no runtime download needed)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 注意：不要设置任何 APPLE_* 环境变量（包括空字符串）。
          # tauri-bundler 只要检测到 APPLE_CERTIFICATE 存在就会尝试导入
          # keychain 证书，空值也会失败——曾导致 macOS 打包全挂。
          # 当前策略：产出未签名安装包直接分发（与移动端 TrollStore 一致），
          # 后续配置有效 Apple 开发者证书后再启用签名。
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prism ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Android APK / TrollStore IPA 由 mobile.yml（push main）构建并上传 artifact，
  # 发布 Release 时手动以 release asset 附上（mobile.yml 含内核与 TrollStore 修复）。

