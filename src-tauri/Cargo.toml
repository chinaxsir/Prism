[package]
name = "prism-proxy"
version = "0.1.0"
description = "Prism - A modern cross-platform proxy client"
authors = ["Prism Team"]
license = "GPL-3.0"
repository = "https://github.com/your-org/prism"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

# Tauri 移动端（Android/iOS）需要 lib 以 staticlib/cdylib 输出，
# 名称与 main.rs 中 prism_proxy_lib::run() 对应
[lib]
name = "prism_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"

# Async runtime & networking
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# IPC / RPC
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"

# Misc
anyhow = "1.0"
base64 = "0.22"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
once_cell = "1.19"
parking_lot = "0.12"
bytes = "1.5"

# TUN / networking (platform-gated)
tun = { version = "0.6", optional = true }

# Plugin / WASM runtime (optional future extensibility)
wasmtime = { version = "18.0", optional = true }

# Platform-specific networking（必须放在普通 dependencies 之后，
# 否则其后的裸键会被归入 target 专属表）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Services",
] }
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
tun-mode = ["dep:tun"]
wasm-plugins = ["dep:wasmtime"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
